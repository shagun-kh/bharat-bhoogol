<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharat Bhoogol · भारत भूगोल</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, precise, quietly helpful — like a well-made Apple app.
   IDEA: an Apple Maps sheet of India with frosted controls floating over it.
   PICTURE: the map on the chosen date fills the screen; the pieces are its own shapes in soft system colours.
   COLOUR and TYPE: Apple Maps water and land, system blue for action, system red pins; SF Pro (Inter elsewhere).
   LAYOUT: map is the stage; a glass timeline card with an Apple slider; an inset sidebar for quizzes. */
:root{color-scheme:light dark;
  --sea:light-dark(#aed6f1,#15283a);--land:light-dark(#f8f6f1,#2c2c2e);--landh:light-dark(#fff1d0,#3d3d42);
  --border:light-dark(#c3b9a6,#55555c);--coast:light-dark(rgba(60,70,80,.32),rgba(200,215,230,.32));
  --ink:light-dark(#1d1d1f,#f5f5f7);--mute:light-dark(#6e6e73,#98989d);
  --panel:light-dark(#ffffff,#2c2c2e);--side:light-dark(#f2f2f7,#1c1c1e);
  --glass:light-dark(rgba(255,255,255,.74),rgba(40,40,44,.72));--blur:saturate(180%) blur(22px);
  --fill:light-dark(rgba(120,120,128,.12),rgba(120,120,128,.26));--fill2:light-dark(rgba(120,120,128,.2),rgba(120,120,128,.36));
  --line:light-dark(rgba(60,60,67,.14),rgba(84,84,88,.55));--chip:var(--fill);
  --accent:light-dark(#007aff,#0a84ff);--accentInk:#fff;--ok:light-dark(#34c759,#30d158);--red:light-dark(#ff3b30,#ff453a);
  --hatch:light-dark(#c9c1b0,#5c5c62);
  --c0:light-dark(#ffb340,#e89a2e);--c1:light-dark(#ff8097,#e2647c);--c2:light-dark(#62a9ff,#3f8fea);
  --c3:light-dark(#72d37d,#4fbf5e);--c4:light-dark(#bc90f5,#a373e8);--c5:light-dark(#ffd84a,#e0bb2c);--c6:light-dark(#52d1c4,#34bbaf);
  --shadow:0 10px 30px light-dark(rgba(0,0,0,.12),rgba(0,0,0,.45)),0 1px 2px light-dark(rgba(0,0,0,.06),rgba(0,0,0,.3));
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue","Noto Sans Devanagari",system-ui,sans-serif;
  --sfd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue","Noto Sans Devanagari",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font:16px/1.45 var(--sf);letter-spacing:-.01em;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
input,textarea,.code{-webkit-user-select:text;user-select:text}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.cap{display:none}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:var(--fill);border-radius:980px;min-height:36px;padding:0 16px;font-weight:600;font-size:15px;transition:transform .12s,background .15s,opacity .15s}
button:hover{background:var(--fill2)}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.tile:focus-visible,.slider:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default;transform:none}
.primary{background:var(--accent);color:var(--accentInk)}
.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.icon{width:36px;padding:0;display:inline-grid;place-items:center;border-radius:50%}
.link{background:none;padding:0;min-height:0;color:var(--accent);font-weight:500}
.link:hover{background:none;text-decoration:underline}
h1,h2,h3{font-family:var(--sfd);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.022em;font-weight:700}
#app[hidden]{display:none}
#app{position:fixed;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
.top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:10px;padding:12px 14px;position:relative;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.top button,.zoom button{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow);min-height:38px}
.top button:hover,.zoom button:hover{background:var(--panel)}
.top .primary{background:var(--accent);color:#fff}.top .primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.top .icon,.zoom .icon{width:38px}
.brand{display:flex;align-items:center;gap:10px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:980px;padding:6px 18px 6px 7px;box-shadow:var(--shadow)}
.brand b{font-family:var(--sfd);font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.brand span{font-family:var(--sfd);font-weight:700;font-size:19px;color:var(--accent);letter-spacing:-.02em;line-height:1}
.brand small{display:block;color:var(--mute);font-size:12.5px;line-height:1.15;margin-top:2px;letter-spacing:0}
.brand>div{white-space:nowrap}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.themebtn{flex:none}
.sm{display:none}
#dragG.snap path{stroke:var(--accent)!important;stroke-width:2.5!important;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 70%,transparent)) drop-shadow(0 8px 14px rgba(0,0,0,.2))}
#dragG.snap text{font-weight:700}
.tile{cursor:grab}
html.dragging,html.dragging *{cursor:grabbing!important}
html.dropok,html.dropok *{cursor:var(--okcur,copy)!important}
#side{grid-column:1;grid-row:1/4;width:344px;margin:74px 0 10px 10px;border-radius:22px;background:var(--side);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:auto;padding:18px;gap:16px;z-index:4;scrollbar-width:thin}
#side[hidden]{display:none}
#stage{grid-column:2;grid-row:1/3;position:relative;overflow:hidden;touch-action:none}
body.noside #stage{grid-column:1/-1}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.u{fill:var(--land);stroke:none;cursor:pointer;transition:fill .18s}
.u.foreign{fill:url(#hatch)}
.u.hov{fill:var(--landh)}
.u.on{stroke:none}
.c0{fill:var(--c0)}.c1{fill:var(--c1)}.c2{fill:var(--c2)}.c3{fill:var(--c3)}.c4{fill:var(--c4)}.c5{fill:var(--c5)}.c6{fill:var(--c6)}
.u.flash{animation:flash .7s ease-out}
@keyframes flash{0%{filter:brightness(1.35) saturate(1.2)}100%{filter:none}}
.play .u{cursor:default}.play.selecting .u,.play.selecting .ring{cursor:crosshair}
#borders{fill:none;stroke:var(--border);stroke-width:.9;vector-effect:non-scaling-stroke;pointer-events:none}
#pborders{fill:none;stroke:light-dark(rgba(60,50,30,.45),rgba(220,220,230,.4));stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
svg.play #borders{stroke:light-dark(rgba(110,95,70,.85),rgba(200,200,210,.55));stroke-width:1.2}
#outline{fill:none;stroke:var(--coast);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.ring{fill:transparent;stroke:var(--mute);stroke-width:1.1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;cursor:pointer}
.ring.on{stroke:var(--ink);stroke-dasharray:none}
#labels text{font-family:var(--sf);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:light-dark(rgba(255,255,255,.85),rgba(20,20,22,.8));stroke-linejoin:round;pointer-events:none;letter-spacing:-.01em}
#labels text.ctx{fill:var(--mute);font-weight:500;font-style:italic}
#labels text.dim{fill:var(--mute);font-weight:500}
#labels text.city{font-weight:600;fill:var(--ink)}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:3;align-items:flex-end}
.zoom button{font-size:19px;font-weight:500}
.zoom .capbtn{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;padding:0 14px}
.zoom .capbtn svg{color:var(--red)}
.zoom .capbtn.on{background:var(--accent);color:#fff}.zoom .capbtn.on svg{color:#fff}
body.play #zcaps{display:none}
body.explore .zoom{bottom:auto;top:72px}
#pins .pm{fill:var(--ink);stroke:var(--panel);stroke-width:1.6;vector-effect:non-scaling-stroke}
#pins .ps{fill:var(--panel);stroke:var(--ink);stroke-width:1.8;vector-effect:non-scaling-stroke}
#pins .pn{fill:var(--red);stroke:var(--panel);stroke-width:1.2;vector-effect:non-scaling-stroke}
#pins .hit{fill:transparent;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:10px;padding:2px;gap:2px;background:var(--fill)}
.seg button{min-height:32px;background:transparent;border-radius:8px;font-size:14px;font-weight:500;padding:0 6px;color:var(--ink)}
.seg button:hover{background:transparent}
.seg button.on{background:light-dark(#fff,#636366);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
#tip{position:absolute;z-index:6;pointer-events:none;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:14px;box-shadow:var(--shadow);padding:9px 13px;max-width:270px;font-size:14px;line-height:1.35}
#tip b{display:block;font-size:15px;font-weight:600}#tip i{color:var(--mute);font-style:normal;font-size:13px}#tip p{margin:5px 0 0;color:var(--ink)}
/* timeline */
#tl{grid-column:2;grid-row:3;margin:0 auto 14px;width:min(820px,calc(100% - 28px));background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:26px;box-shadow:var(--shadow);padding:16px 20px 14px;z-index:4}
body.noside #tl{grid-column:1/-1}
#tl[hidden]{display:none}
.tl-head{display:flex;align-items:center;gap:10px}
.tl-date{flex:1;text-align:center}
.tl-date h2{font-size:clamp(22px,3.2vw,30px);font-variant-numeric:tabular-nums}
.tl-date .chip{display:inline-block;font:600 12px/1 var(--sf);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border-radius:980px;padding:5px 9px;vertical-align:middle;margin-left:8px;letter-spacing:0}
#tlTitle{font-weight:600;color:var(--ink);font-size:15px;margin-top:3px}
#tlText{margin:4px auto 2px;color:var(--mute);font-size:14px;max-width:62ch;text-align:center;min-height:2.6em}
.datein{border:0;border-radius:980px;min-height:36px;padding:0 12px;background:var(--fill);font-size:15px;width:150px;color:var(--ink)}
/* Apple-style slider */
.slider{position:relative;height:64px;touch-action:none;cursor:pointer;outline:none;margin:2px 0 0}
.slider .track{position:absolute;left:14px;right:14px;top:22px;height:4px;border-radius:4px;background:var(--fill2)}
.slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent);transition:width .25s cubic-bezier(.2,.8,.2,1)}
.slider .marks i{position:absolute;top:22px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:light-dark(rgba(0,0,0,.28),rgba(255,255,255,.35));pointer-events:none}
.slider .marks i.done{background:rgba(255,255,255,.85)}
.slider .years span{position:absolute;top:42px;transform:translateX(-50%);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;pointer-events:none}
.slider .thumb{position:absolute;top:10px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.04);transition:left .25s cubic-bezier(.2,.8,.2,1),transform .15s;pointer-events:none}
.slider.drag .thumb,.slider.drag .fill{transition:none}
.slider.drag .thumb{transform:scale(1.12)}
.slider .bubble{position:absolute;left:50%;bottom:36px;transform:translate(-50%,6px) scale(.9);opacity:0;white-space:nowrap;background:var(--ink);color:var(--panel);font:600 13px/1 var(--sf);padding:7px 10px;border-radius:9px;transition:opacity .15s,transform .15s;font-variant-numeric:tabular-nums}
.slider.drag .bubble,.slider:focus-visible .bubble{opacity:1;transform:translate(-50%,0) scale(1)}
.tl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tl-foot p{margin:0;font-size:13px;color:var(--mute)}
/* side panels */
.field{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--mute)}
.field input,.field textarea{border:0;border-radius:11px;padding:10px 12px;background:var(--panel);font-size:16px;font-weight:400;color:var(--ink)}
.field textarea{resize:vertical;min-height:76px;line-height:1.4}
#pop .field input,#pop .field textarea{background:var(--fill)}
.toggle{display:flex;gap:12px;align-items:center;font-size:15px;cursor:pointer;min-height:44px;background:var(--panel);border-radius:12px;padding:6px 8px 6px 14px}
.toggle input{appearance:none;-webkit-appearance:none;order:2;margin:0 0 0 auto;flex:none;width:51px;height:31px;border-radius:31px;background:var(--fill2);position:relative;cursor:pointer;transition:background .25s}
.toggle input::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.toggle input:checked{background:var(--ok)}
.toggle input:checked::before{transform:translateX(20px)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row h3{font-size:20px;margin-right:auto}
.hint{margin:0;color:var(--mute);font-size:13.5px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0;background:var(--panel);border-radius:14px;overflow:hidden}
.plist li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px 10px 14px;cursor:pointer;position:relative}
.plist li+li::before{content:"";position:absolute;top:0;left:38px;right:0;height:.5px;background:var(--line)}
.plist li:hover{background:var(--fill)}
.plist .sw{width:12px;height:12px;border-radius:50%}
.plist b{display:block;font-size:15px;line-height:1.25;font-weight:600}
.plist small{display:block;color:var(--mute);font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist button{min-height:30px;width:30px;padding:0;background:none;color:var(--mute);font-size:20px;border-radius:50%}
.plist button:hover{background:var(--fill);color:var(--red)}
.empty{background:var(--panel);border-radius:14px;padding:18px;color:var(--mute);font-size:14px;text-align:center}
.sw0{background:var(--c0)}.sw1{background:var(--c1)}.sw2{background:var(--c2)}.sw3{background:var(--c3)}.sw4{background:var(--c4)}.sw5{background:var(--c5)}.sw6{background:var(--c6)}
.ptitle{font-size:clamp(26px,3vw,32px)}
.sub{margin:4px 0 0;color:var(--mute);font-size:15px}
.prog{display:grid;gap:7px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--fill2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bank{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--panel);border-radius:16px;padding:8px 4px 6px;display:grid;justify-items:center;align-content:start;gap:0;min-height:100px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;position:relative;box-shadow:0 1px 2px light-dark(rgba(0,0,0,.05),rgba(0,0,0,.3));transition:transform .15s,box-shadow .15s,opacity .15s}
.tile:hover{transform:translateY(-1px);box-shadow:0 6px 16px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.4))}
.tile svg{width:100%;height:62px;overflow:visible;pointer-events:none}
.tile span{font-size:12px;line-height:1.15;text-align:center;font-weight:600;padding:4px 2px 0;overflow-wrap:break-word;max-width:100%}
.tile span.long{font-size:11px}
.tile em{font-style:normal;font-size:11px;color:var(--mute);line-height:1.15;text-align:center;padding:1px 2px 0;overflow-wrap:break-word;max-width:100%}
.tile.pin svg{height:38px;margin:6px 0 2px}
.tile.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tile.lift{opacity:.3}
.tile.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.tile path{vector-effect:non-scaling-stroke;stroke-width:1.4}
.done-bank{text-align:center;color:var(--ok);font-weight:600;padding:18px;background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:14px}
/* prompt card */
#prompt{position:absolute;left:50%;top:68px;transform:translateX(-50%);width:min(560px,calc(100% - 28px));background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:18px;box-shadow:var(--shadow);padding:12px 12px 12px 16px;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
#prompt[hidden]{display:none}
#prompt small{justify-self:start;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);font-size:12px;font-weight:600;border-radius:980px;padding:3px 9px}
#prompt.ok small{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
#prompt p{margin:0;font-size:17px;line-height:1.35;grid-column:1}
#prompt .nav{grid-column:2;grid-row:1/3;display:flex;gap:6px}
#prompt .nav button{width:34px;min-height:34px;padding:0;border-radius:50%;font-size:18px}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:light-dark(rgba(30,30,32,.86),rgba(245,245,247,.9));color:light-dark(#fff,#1d1d1f);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);padding:10px 18px;border-radius:980px;font-weight:600;font-size:15px;z-index:6;opacity:0;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* popover */
#pop{position:absolute;z-index:7;width:310px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px 16px;display:grid;gap:12px}
#pop[hidden]{display:none}
.pop-h{display:flex;align-items:start;gap:8px}.pop-h b{font-family:var(--sfd);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.15;flex:1}
.pop-h small{display:block;font:500 13px var(--sf);color:var(--mute);letter-spacing:0}
.pop-h .icon{width:30px;min-height:30px;font-size:13px}
.pop-f{display:flex;gap:8px;justify-content:space-between}
#popRemove{color:var(--red)}
/* drag overlay */
#drag{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:20;overflow:visible}
#drag path{vector-effect:non-scaling-stroke;stroke-width:1.5;filter:drop-shadow(0 8px 14px rgba(0,0,0,.22))}
#drag text{font:600 13px var(--sf);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
#drag circle{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.wm{position:fixed;bottom:4px;z-index:6;font-size:11px;color:var(--mute);pointer-events:none;opacity:.85}.wl{left:14px}.wr{right:14px}
.zoom{margin-bottom:12px}#side{margin-bottom:22px!important}#tl{margin-bottom:20px!important}
@media (max-width:760px){.wr{display:none}.wl{left:50%;transform:translateX(-50%);bottom:1px;font-size:10px}}
/* onboarding tour */
#tour{position:fixed;inset:0;z-index:40}
#tour[hidden]{display:none}
#tour .spot{position:fixed;border-radius:18px;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 0 9999px rgba(0,0,0,.58),0 0 40px 6px rgba(0,0,0,.35);transition:left .38s cubic-bezier(.2,.8,.2,1),top .38s cubic-bezier(.2,.8,.2,1),width .38s cubic-bezier(.2,.8,.2,1),height .38s cubic-bezier(.2,.8,.2,1),border-radius .38s;pointer-events:none}
#tour .spot.none{box-shadow:0 0 0 9999px rgba(0,0,0,.58)}
#tour .tcard{position:fixed;width:min(340px,calc(100vw - 24px));background:var(--panel);border-radius:20px;padding:18px 18px 14px;box-shadow:0 24px 60px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.18);display:grid;gap:8px;transition:left .38s cubic-bezier(.2,.8,.2,1),top .38s cubic-bezier(.2,.8,.2,1),opacity .2s;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
#tour h3{font-size:20px}
#tour p{margin:0;font-size:15px;line-height:1.45;color:var(--ink)}
#tour p b{font-weight:600}
.tdots{display:flex;gap:5px}.tdots i{width:6px;height:6px;border-radius:6px;background:var(--fill2);transition:width .25s,background .25s}.tdots i.on{width:18px;background:var(--accent)}
.tbtns{display:flex;align-items:center;gap:8px;margin-top:6px}.tbtns span{flex:1}
.tarrow{position:absolute;width:16px;height:16px;background:var(--panel);transform:rotate(45deg);border-radius:3px;box-shadow:-2px -2px 4px rgba(0,0,0,.06)}
.tarrow[hidden]{display:none}
/* modal */
#modal{position:fixed;inset:0;z-index:30;background:light-dark(rgba(0,0,0,.22),rgba(0,0,0,.5));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fade .2s}
#modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:0}}
.card{background:var(--panel);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.25);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;display:grid;gap:14px;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.card h2{font-size:28px}
.card p{margin:0}
.code{width:100%;border:0;border-radius:12px;padding:12px;font:14px/1.4 ui-monospace,"SF Mono",Menlo,monospace;background:var(--fill);resize:none;overflow-wrap:anywhere;color:var(--ink)}
.samples{display:grid;gap:8px}
.samples button{text-align:left;padding:12px 16px;display:grid;gap:2px;height:auto;border-radius:14px;font-size:16px}
.samples button small{color:var(--mute);font-weight:400;font-size:14px}
.samples .row>button:last-child{border-radius:980px;color:var(--accent)}
.err{color:var(--red);font-size:14px;margin:0}
.big{font-family:var(--sfd);font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--ok)}
.load{position:fixed;inset:0;display:grid;place-items:center;font:600 20px var(--sfd);color:var(--mute)}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  #stage{grid-column:1;grid-row:1/3}
  #side{grid-column:1;grid-row:3;width:auto;max-height:46vh;margin:0 8px 8px;padding:14px 14px 12px;gap:12px;border-radius:22px}
  #side::before{content:"";align-self:center;flex:none;width:36px;height:5px;border-radius:5px;background:var(--fill2);margin:-6px 0 -4px}
  #tl{grid-column:1;grid-row:3;margin:0 8px 8px;width:auto;padding:12px 14px 10px;border-radius:24px}
  .brand small{display:none}.brand{padding:5px 13px 5px 6px;gap:8px}.brand b,.brand span{font-size:16px}.brand svg{width:28px;height:28px}
  body:not(.explore) .brand{display:none}
  .sm{display:inline}.lg{display:none}.top{align-items:flex-start;gap:6px;padding:8px}.actions{flex-wrap:nowrap;gap:6px}.brand{flex:none}#aAbout{width:38px;padding:0}
  .actions button{min-height:38px;padding:0 12px;font-size:14px}.actions .icon{width:38px;padding:0}
  body.explore .zoom,.zoom{top:auto;bottom:12px;right:10px}.zoom button{min-height:36px}.zoom .icon{width:36px}.zoom .capbtn{font-size:14px;padding:0 12px}
  .bank{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:96px;overflow-x:auto;padding:2px 2px 6px}
  .tile{touch-action:pan-x}
  .cap{display:none}
  .datein{width:132px;font-size:14px;padding:0 10px}
  .tl-head{flex-wrap:wrap}.tl-date{order:-1;flex-basis:100%}
  .play #side .sidehide{display:none}
  #prompt{top:58px}#prompt p{font-size:15px}
  #pop{left:8px!important;right:8px;width:auto;top:auto!important;bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <footer id="tl">

  $('#card').querySelectorAll('[data-e]').forEach(b => b.onclick = () => {
    const c = cfgOf(SAMPLES[+b.dataset.e]); closeModal(); snap();
    S.date = c.d; S.era = eraFor(c.d); units(S.era); S.title = c.t; S.names = c.n; S.borders = c.b; S.qm = c.m; S.pieces = c.p; save(); setMode('choose');
  });
}
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function save(){ if (S.mode === 'play' && S.from !== 'editor') return; store.set('bharat-bhoogol-draft', {d:S.date, p:S.pieces, t:S.title, n:S.names, b:S.borders, m:S.qm, c:S.caps}); }

/* ---------- boot ---------- */
new ResizeObserver(() => { drawLabels(); if (S.mode === 'explore') drawRuler(); }).observe(document.body);
(async () => {
  try {
    const [topo, eras] = await Promise.all([fetch('data/districts.json').then(r => r.json()), fetch('data/eras.json').then(r => r.json())]);
    TOPO = topo; OBJ = topo.objects.districts; GEOMS = OBJ.geometries; GEOMS.forEach((g, i) => g._i = i);
    ERAS = eras.eras; META = eras.meta; CAPS = eras.caps;
    svg.setAttribute('viewBox', `-30 -50 ${META.W + 60} ${META.H + 70}`);
    OUTLINE = linePath(topojson.mesh(TOPO, OBJ, (a, b) => a === b));
  } catch (err) { $('#loading').textContent = 'The map data could not be loaded. Please reload the page.'; return; }
  $('#loading').remove(); $('#app').hidden = false;
  const dr = store.get('bharat-bhoogol-draft');
  if (dr && typeof dr.d === 'string' && /^\d{4}-\d\d-\d\d$/.test(dr.d)){ S.date = dr.d < MIN_DATE ? MIN_DATE : dr.d > TODAY ? TODAY : dr.d; S.pieces = Array.isArray(dr.p) ? dr.p : []; S.title = dr.t || ''; S.names = dr.n !== false; S.borders = dr.b !== false; S.qm = [0, 1, 2].includes(dr.m) ? dr.m : 0; S.caps = !!dr.c; }
  S.era = eraFor(S.date); units(S.era);
  S.pieces = S.pieces.filter(p => S.era._k[p.k]);
  setMode('explore'); drawTimeline(); applyView();
  capBtn();
  const h = location.hash;
  if (h.startsWith('#play-')){ try { startPlay(await decode(h), 'code'); } catch { toast('That quiz link is incomplete'); } }
  else setTimeout(() => { if (S.mode === 'explore') startTour('explore'); }, 700);
})();
}
</script>
